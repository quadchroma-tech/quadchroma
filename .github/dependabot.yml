# Dependabot: keeps the GitHub Actions pinned by commit SHA in
# .github/workflows/*.yml up to date (SHA and tag comment in one pull request).
#
# Deliberately ONLY github-actions: the Rust dependencies (client/Cargo.lock)
# are maintained by hand - no new crates, no unrequested updates.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
