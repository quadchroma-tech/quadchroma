# Chooser page for new issues: no blank issues; instead, links to security
# reporting, commercial license requests and the documentation.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/quadchroma-tech/quadchroma/blob/main/SECURITY.md
    about: Please do not report security problems in a public issue. SECURITY.md describes private reporting on GitHub and the e-mail channel.
  - name: Commercial license or use beyond LICENSE.txt
    url: mailto:hello@quadchroma.tech?subject=QuadChroma%20commercial%20licence
    about: Business use, embedding, or any permission that LICENSE.txt does not give - write to hello@quadchroma.tech.
  - name: Questions about using QuadChroma
    url: https://github.com/quadchroma-tech/quadchroma/blob/main/README.md
    about: README.md covers setup, pairing with password or "Allow", the client and the Windows host role; MANUAL.txt is the full reference. Still stuck? E-mail hello@quadchroma.tech.
