# QuadChroma - build and test on every push to main and on every pull request.
#
# FFmpeg (macos-26): the FFmpeg DLLs for Windows via scripts/build-ffmpeg-windows.sh
#   (minimal LGPL build, MinGW-w64 from Homebrew) - the same path as for a release.
# Windows (windows-2025): Rust client including the host role, built against these DLLs.
#   build.rs finds rc.exe in the runner's Windows SDK (llvm-rc as the fallback).
# macOS (macos-26): the one Mac app - make builds the Rust client with cargo (the
#   Objective-C/C host engine compiled into it by client/build.rs) and bundles it as
#   QuadChroma.app (ad-hoc signed, never started with its service); no FFmpeg on the Mac,
#   the client decodes with VideoToolbox (its VideoToolbox tests skip themselves if the
#   runner has no hardware encoder). Then the test harnesses without screen capture,
#   ZIP/DMG packaging through the Makefile, and the client's tests and self-tests.
# The Windows jobs keep FFmpeg: the ffmpeg job builds the DLLs, the windows job builds
#   and tests quadchroma.exe (client and host role in one program) against them.
#
# Needs no secrets and therefore also runs for pull requests from forks.
# Actions are pinned by commit SHA (tag as a comment; Dependabot maintains both).
# Runners are named explicitly (not -latest) so that tool versions do not change
# unnoticed; today windows-2025 and macos-26 are the "-latest" images.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ffmpeg:
    name: FFmpeg for Windows (LGPL, own build)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: FFmpeg from the cache (key = build script)
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffmpeg-windows
          key: ffmpeg-windows-${{ hashFiles('scripts/build-ffmpeg-windows.sh') }}

      - name: Build FFmpeg (the checksums of the source archives are in the script)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          brew install mingw-w64 nasm pkgconf
          scripts/build-ffmpeg-windows.sh ffmpeg-windows
          cat ffmpeg-windows/BUILDINFO.txt

      - name: Hand FFmpeg to the Windows job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-windows
          path: ffmpeg-windows
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows (x86_64-pc-windows-msvc)
    needs: ffmpeg
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # build.rs: fail without rc.exe/llvm-rc instead of producing an exe without version
      # info, icon and manifest. Set at job level so that build and tests see the same environment.
      QC_RESSOURCEN_PFLICHT: '1'
    defaults:
      run:
        shell: pwsh
        # Build from client\, otherwise Cargo does not read client/.cargo/config.toml (crt-static).
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust (stable)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: FFmpeg from the FFmpeg job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-windows
          path: C:\ffmpeg-qc

      - name: Environment for ffmpeg-sys-next (FFMPEG_DIR, LIBCLANG_PATH, PATH)
        run: |
          if ($env:RUSTFLAGS) { throw "RUSTFLAGS is set - it would override client/.cargo/config.toml (crt-static)" }
          $ffmpeg = "C:\ffmpeg-qc"
          if (-not (Test-Path "$ffmpeg\lib\avcodec.lib")) { throw "FFmpeg (lib\avcodec.lib) not found in $ffmpeg" }
          "FFMPEG_DIR=$ffmpeg" >> $env:GITHUB_ENV
          "$ffmpeg\bin" >> $env:GITHUB_PATH
          # libclang for bindgen: LLVM (Chocolatey) in C:\Program Files\LLVM, otherwise the
          # Clang from Visual Studio 2026. The same folder contains llvm-rc.exe, the
          # fallback of build.rs (rc.exe from the Windows SDK takes precedence).
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvm\libclang.dll")) {
            $llvm = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\Llvm\x64\bin"
          }
          if (-not (Test-Path "$llvm\libclang.dll")) { throw "libclang.dll not found (neither LLVM nor the Visual Studio Clang)" }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
          "$llvm" >> $env:GITHUB_PATH
          "FFMPEG_DIR=$ffmpeg`nLIBCLANG_PATH=$llvm"

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: client -> target

      - name: Build
        run: cargo build --release --locked

      - name: Check the exe (crt-static, version resource from build.rs)
        run: |
          $exe = "target\release\quadchroma.exe"
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          if ($text -match 'VCRUNTIME140') { throw "quadchroma.exe imports VCRUNTIME140 - crt-static is not in effect" }
          $vi = (Get-Item $exe).VersionInfo
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "ProductVersion=$($vi.ProductVersion) FileVersion=$($vi.FileVersion) CompanyName=$($vi.CompanyName) ProductName=$($vi.ProductName)"
          if ($vi.ProductVersion -ne $cargo) { throw "Version resource '$($vi.ProductVersion)' does not match Cargo.toml '$cargo' (build.rs, res/quadchroma.rc)" }

      - name: Tests (separate APPDATA, FFmpeg DLLs in PATH)
        env:
          # %APPDATA%\QuadChroma is the client's data folder - the tests get their own.
          APPDATA: ${{ runner.temp }}\appdata-tests
        run: |
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          cargo test --release --locked

      - name: Upload the exe as an artifact (7 days, unsigned - for trying out only)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quadchroma-windows-x64-ci
          path: client/target/release/quadchroma.exe
          retention-days: 7
          if-no-files-found: error

  macos:
    name: macOS (the one app, test harnesses, packaging)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # QuadChroma.app runs the Rust client with the host engine built in: make builds it
      # with cargo, so Rust comes first.
      - name: Rust (stable)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: client -> target

      - name: Build the app (cargo, bundle, ad-hoc signed; the app is not started)
        run: make IDENT=-

      - name: Verify the signature (make verify; Gatekeeper rejects ad-hoc signatures, as expected)
        run: make verify IDENT=-

      - name: Check the app (one executable, the Rust client with the host engine; no FFmpeg)
        run: |
          set -euo pipefail
          macos=build/QuadChroma.app/Contents/MacOS
          [ "$(ls "$macos")" = "quadchroma" ] || { echo "::error::Contents/MacOS must hold exactly the one executable quadchroma, found: $(ls "$macos" | tr '\n' ' ')"; exit 1; }
          exe="$macos/quadchroma"
          otool -L "$exe"
          if otool -L "$exe" | grep -Ei 'libav|libsw|ffmpeg'; then echo "::error::the Mac app links FFmpeg - it decodes with VideoToolbox and must not"; exit 1; fi
          # Symbols into a file first: grep -q ending early would break nm's pipe (pipefail).
          nm "$exe" > "$RUNNER_TEMP/app-symbole.txt"
          if grep -Eq ' _av(codec|util|format)?_[a-z]' "$RUNNER_TEMP/app-symbole.txt"; then echo "::error::FFmpeg symbols in the Mac app"; exit 1; fi
          # The host engine is built in (host/dienst.h), not a second program.
          grep -q ' _qc_dienst_starten$' "$RUNNER_TEMP/app-symbole.txt" || { echo "::error::the host engine (qc_dienst_starten) is missing from the app"; exit 1; }

      - name: Package ZIP and DMG (make zip, make dmg) and check their contents (make check-packages)
        run: |
          set -euo pipefail
          make zip IDENT=-
          make dmg IDENT=-
          ls -l build/*.zip build/*.dmg
          # The four companion texts in the app (Contents/Resources, sealed), next to it in the
          # ZIP folder and in the DMG; no AppleDouble entries; the app in the DMG verifies.
          make check-packages IDENT=-

      - name: Compile the test harnesses
        run: |
          set -euo pipefail
          mkdir -p build
          clang -O2 -Wall -Ihost -Ihost/vendor/monocypher host/noisetest.c host/qc_noise.c host/zugang.c \
                host/qc_secure.c host/vendor/monocypher/monocypher.c -o build/noisetest
          clang -O2 -Wall -Ihost -Ihost/vendor/monocypher host/annahmetest.c host/qc_annahme.c \
                host/qc_secure.c host/qc_noise.c host/vendor/monocypher/monocypher.c -o build/annahmetest
          clang -O2 -Wall -Ihost -Ihost/vendor/monocypher host/zugangtest.c host/zugang.c \
                host/qc_secure.c host/qc_noise.c host/vendor/monocypher/monocypher.c -o build/zugangtest
          clang -fobjc-arc -O2 -Wall -Wextra -Wno-unused-parameter -Ihost -mmacosx-version-min=14.0 \
                -framework Foundation host/dateitest.m host/dateien.m -o build/dateitest
          clang -fobjc-arc -O2 -Wall -Ihost -mmacosx-version-min=14.0 -framework Foundation \
                -framework AppKit host/ablagetest.m -o build/ablagetest
          # menuetest: texts (29 tables) and the menu bar model, without showing anything.
          clang -fobjc-arc -O2 -Wall -Wextra -Wno-unused-parameter -Ihost -mmacosx-version-min=14.0 \
                -framework Foundation -framework AppKit -framework ServiceManagement \
                host/menuetest.m host/menue.m host/texte.m -o build/menuetest
          # einbettungstest: the menu bar layer embedded as in the Rust client (winit owns
          # the application delegate); needs the runner's window server, no permission.
          clang -fobjc-arc -O2 -Wall -Wextra -Wno-unused-parameter -Ihost -mmacosx-version-min=14.0 \
                -framework Foundation -framework AppKit -framework ServiceManagement -framework CoreServices \
                host/einbettungstest.m host/menue.m host/texte.m -o build/einbettungstest
          # The former stand-alone host (host/start.m), kept for the harnesses: it must still link.
          make host-allein
          # hosttest needs Screen Recording (a TCC permission) at run time, which a runner
          # does not have - only compile it here; that catches compile errors.
          clang -fobjc-arc -O2 -Wall -Ihost -Ihost/vendor/monocypher -Wno-deprecated-declarations \
                -mmacosx-version-min=14.0 -framework Foundation -framework AppKit \
                -framework ScreenCaptureKit -framework VideoToolbox -framework CoreMedia \
                -framework CoreVideo -framework CoreGraphics -framework CoreFoundation -framework IOKit \
                -framework SystemConfiguration \
                host/hosttest.m host/audio.m host/clipboard.m host/zeiger.m host/testbild.m host/last.m \
                host/dateien.m host/bildschirm.m host/hdr.c host/qc_noise.c host/qc_secure.c host/qc_annahme.c \
                host/zugang.c host/vendor/monocypher/monocypher.c -o build/hosttest

      - name: Run the test harnesses that need no TCC permission (noisetest, annahmetest, zugangtest, dateitest, ablagetest, menuetest, einbettungstest)
        run: |
          set -euo pipefail
          # noisetest prints two log lines and "OK" as the last line.
          out=$(build/noisetest); echo "$out"; [ "$(printf '%s\n' "$out" | tail -n 1)" = "OK" ]
          build/annahmetest
          build/zugangtest
          build/dateitest
          build/ablagetest
          build/menuetest
          build/einbettungstest

      - name: Build and test the client (without the clipboard tests, as in the documented recipe)
        working-directory: client
        run: |
          set -euo pipefail
          cargo build --release --locked
          cargo test --release --locked -- --skip clipboard
          # The one app's menu bar icon without the service (no listening, no capture, a
          # throw-away HOME) and "Prevent sleep" as pmset -g assertions shows it.
          target/release/quadchroma --menueleiste-selbsttest
          target/release/quadchroma --ruhe-selbsttest

      - name: Upload the host packages as an artifact (7 days, ad-hoc signed - for trying out only)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quadchroma-macos-arm64-ci
          path: |
            build/*.zip
            build/*.dmg
          retention-days: 7
          if-no-files-found: error
