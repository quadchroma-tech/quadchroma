# QuadChroma - release on a tag vX.Y.Z (e.g. v0.1.0).
#
# Jobs:
#   vorpruefung        version from the tag checked against client/Cargo.toml, client/Cargo.lock
#                      and host/Info.plist; switches from the secrets (only true/false leave the job)
#   ffmpeg             FFmpeg DLLs for Windows via scripts/build-ffmpeg-windows.sh (minimal
#                      LGPL build, MinGW-w64 from Homebrew) plus the source archives for the assets
#   windows            build, test, exe and the two FFmpeg DLLs as artifacts
#   windows-signieren  Azure Artifact Signing (formerly Trusted Signing) - only with secrets
#   windows-paket      quadchroma-<version>-windows-x64[-unsigned].zip
#   macos              the one Mac app (client and host): make builds the Rust client with
#                      cargo, the host engine compiled into it, no FFmpeg; Developer ID
#                      signature, notarization, ZIP + DMG through the Makefile - without
#                      secrets ad-hoc signed with the suffix -unsigned (-selfsigned: the
#                      project's own certificate; -unnotarized: signed but not notarized)
#   release            SHA256SUMS.txt and a release DRAFT with all assets; it is published
#                      by hand after review (RELEASING.md)
#
# The secrets context is not available in jobs.<id>.if. That is why "vorpruefung" reads the
# secrets in its own environment and passes only switches (true/false) to the other jobs.
# Without secrets the workflow still runs through completely - that is the dry run.
#
# Permissions: contents:read for all jobs, id-token:write only for the OIDC login to Azure,
# contents:write only for the job that creates the release draft.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

# Never cancel a running release; a second tag waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The FFmpeg sources (version, checksums) are defined in scripts/build-ffmpeg-windows.sh;
  # only avcodec-63.dll and avutil-61.dll are shipped (THIRD_PARTY_NOTICES.txt, section 2).

jobs:
  vorpruefung:
    name: Check the version, set the switches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      windows_sign: ${{ steps.schalter.outputs.windows_sign }}
      azure_oidc: ${{ steps.schalter.outputs.azure_oidc }}
      mac_sign: ${{ steps.schalter.outputs.mac_sign }}
      mac_notarize: ${{ steps.schalter.outputs.mac_notarize }}
      mac_selbst: ${{ steps.schalter.outputs.mac_selbst }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag version against Cargo.toml, Cargo.lock and Info.plist
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' client/Cargo.toml | head -n 1)
          lock_version=$(awk '/^name = "quadchroma"$/ { getline; sub(/^version = "/, ""); sub(/"$/, ""); print; exit }' client/Cargo.lock)
          plist_version=$(python3 -c 'import plistlib; print(plistlib.load(open("host/Info.plist", "rb"))["CFBundleShortVersionString"])')
          echo "Tag $version | client/Cargo.toml $cargo_version | client/Cargo.lock $lock_version | host/Info.plist $plist_version"
          fehler=0
          [ "$version" = "$cargo_version" ] || { echo "::error file=client/Cargo.toml::version = \"$cargo_version\" does not match the tag v$version"; fehler=1; }
          [ "$version" = "$lock_version" ]  || { echo "::error file=client/Cargo.lock::package quadchroma is at version $lock_version - after changing the version, run cargo build once and commit Cargo.lock (otherwise cargo --locked fails)"; fehler=1; }
          [ "$version" = "$plist_version" ] || { echo "::error file=host/Info.plist::CFBundleShortVersionString $plist_version does not match the tag v$version"; fehler=1; }
          [ "$fehler" = 0 ]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Switches from the secrets (only true/false leave this step)
        id: schalter
        shell: bash
        env:
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_SELFSIGNED_P12_BASE64: ${{ secrets.MAC_SELFSIGNED_P12_BASE64 }}
          MAC_SELFSIGNED_P12_PASSWORD: ${{ secrets.MAC_SELFSIGNED_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # gesetzt NAME...: true if none of the named variables is empty.
          gesetzt() { local v; for v in "$@"; do [ -n "${!v:-}" ] || return 1; done; }
          # eine NAME...: true if at least one of them is set (for the "incomplete" warning).
          eine()    { local v; for v in "$@"; do [ -n "${!v:-}" ] && return 0; done; return 1; }
          fehlend() { local v; for v in "$@"; do [ -n "${!v:-}" ] || printf '%s ' "$v"; done; }

          # Windows: Azure Artifact Signing. Login either with a client secret
          # (AZURE_CLIENT_SECRET) or via OIDC without a secret (AZURE_SUBSCRIPTION_ID for azure/login).
          azure_basis="AZURE_ENDPOINT AZURE_CODE_SIGNING_ACCOUNT AZURE_CERT_PROFILE AZURE_TENANT_ID AZURE_CLIENT_ID"
          windows_sign=false; azure_oidc=false
          if gesetzt $azure_basis && gesetzt AZURE_CLIENT_SECRET; then
            windows_sign=true
          elif gesetzt $azure_basis && gesetzt AZURE_SUBSCRIPTION_ID; then
            windows_sign=true; azure_oidc=true
          elif eine $azure_basis AZURE_CLIENT_SECRET AZURE_SUBSCRIPTION_ID; then
            echo "::warning::Azure secrets incomplete (missing: $(fehlend $azure_basis)and AZURE_CLIENT_SECRET or AZURE_SUBSCRIPTION_ID) - the Windows exe stays unsigned"
          fi

          # macOS: Developer ID signature; notarization additionally needs the Apple ID, team ID
          # and an app-specific password.
          apple_sign="APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY"
          apple_notar="APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD"
          mac_sign=false; mac_notarize=false
          if gesetzt $apple_sign; then
            mac_sign=true
            if gesetzt $apple_notar; then
              mac_notarize=true
            elif eine $apple_notar; then
              echo "::warning::Apple secrets for notarization incomplete (missing: $(fehlend $apple_notar)) - the app is signed but not notarized"
            fi
          elif eine $apple_sign $apple_notar; then
            echo "::warning::Apple secrets for signing incomplete (missing: $(fehlend $apple_sign)) - the app is only ad-hoc signed"
          fi

          # macOS without an Apple account: the free, self-generated certificate "QuadChroma Release"
          # (RELEASING.md). Gatekeeper still asks on the first start, but the Screen Recording and
          # Accessibility permissions survive every update signed with the same certificate -
          # with an ad-hoc signature they would have to be granted again after every update.
          mac_selbst=false
          if [ "$mac_sign" != "true" ] && gesetzt MAC_SELFSIGNED_P12_BASE64 MAC_SELFSIGNED_P12_PASSWORD; then
            mac_selbst=true
          elif [ "$mac_sign" != "true" ] && eine MAC_SELFSIGNED_P12_BASE64 MAC_SELFSIGNED_P12_PASSWORD; then
            echo "::warning::Secrets for the project's own Mac certificate incomplete (missing: $(fehlend MAC_SELFSIGNED_P12_BASE64 MAC_SELFSIGNED_P12_PASSWORD)) - the app is only ad-hoc signed"
          fi

          {
            echo "windows_sign=$windows_sign"
            echo "azure_oidc=$azure_oidc"
            echo "mac_sign=$mac_sign"
            echo "mac_notarize=$mac_notarize"
            echo "mac_selbst=$mac_selbst"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release $GITHUB_REF_NAME"
            echo "- Windows: Authenticode signature via Azure Artifact Signing: **$windows_sign** (OIDC: $azure_oidc)"
            echo "- macOS: Developer ID signature: **$mac_sign**, notarization: **$mac_notarize**, own certificate: **$mac_selbst**"
            echo "- Without a signature the artifacts get the suffix -unsigned (on macOS also -unnotarized or -selfsigned)."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_OUTPUT"

  ffmpeg:
    name: Build FFmpeg for Windows (LGPL)
    needs: vorpruefung
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build FFmpeg (from scratch, no cache; source archive checksums in the script)
        run: |
          set -euo pipefail
          brew install mingw-w64 nasm pkgconf
          scripts/build-ffmpeg-windows.sh ffmpeg-windows
          cat ffmpeg-windows/BUILDINFO.txt

      - name: Hand FFmpeg to the Windows job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-ffmpeg-bau
          path: ffmpeg-windows
          if-no-files-found: error

      - name: Upload the sources of the FFmpeg DLLs as release assets (LGPL 2.1 section 6)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-ffmpeg-quellen
          path: ffmpeg-windows/quellen/*
          if-no-files-found: error

  windows:
    name: Build and test for Windows
    needs: [vorpruefung, ffmpeg]
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # build.rs: fail without rc.exe/llvm-rc instead of producing an exe without version
      # info, icon and manifest. Set at job level so that build and tests see the same environment
      # (otherwise rerun-if-env-changed would make build.rs run again in the test step).
      QC_RESSOURCEN_PFLICHT: '1'
    defaults:
      run:
        shell: pwsh
        # Build from client\, otherwise Cargo does not read client/.cargo/config.toml (crt-static).
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust (stable)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: FFmpeg from the FFmpeg job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-ffmpeg-bau
          path: C:\ffmpeg-qc

      - name: Environment (FFMPEG_DIR, LIBCLANG_PATH, PATH); stage the DLLs to be shipped
        run: |
          if ($env:RUSTFLAGS) { throw "RUSTFLAGS is set - it would override client/.cargo/config.toml (crt-static)" }
          $ffmpeg = "C:\ffmpeg-qc"
          if (-not (Test-Path "$ffmpeg\lib\avcodec.lib")) { throw "FFmpeg (lib\avcodec.lib) not found in $ffmpeg" }
          "FFMPEG_DIR=$ffmpeg" >> $env:GITHUB_ENV
          "$ffmpeg\bin" >> $env:GITHUB_PATH
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvm\libclang.dll")) {
            $llvm = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\Llvm\x64\bin"
          }
          if (-not (Test-Path "$llvm\libclang.dll")) { throw "libclang.dll not found (neither LLVM nor the Visual Studio Clang)" }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
          "$llvm" >> $env:GITHUB_PATH
          # Only the two DLLs that quadchroma.exe loads, plus the build information (size and
          # SHA-256 of each DLL, configuration) - THIRD_PARTY_NOTICES.txt refers to it.
          $ziel = Join-Path $env:RUNNER_TEMP 'dlls'
          New-Item -ItemType Directory -Force -Path $ziel | Out-Null
          foreach ($name in 'avcodec-63.dll', 'avutil-61.dll') {
            Copy-Item "$ffmpeg\bin\$name" $ziel
            "$name " + (Get-FileHash -Algorithm SHA256 "$ffmpeg\bin\$name").Hash.ToLowerInvariant()
          }
          Copy-Item "$ffmpeg\BUILDINFO.txt" (Join-Path $ziel 'FFMPEG-BUILDINFO.txt')

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: client -> target

      - name: Build
        run: cargo build --release --locked

      - name: Check the exe (crt-static, version resource = tag)
        env:
          VERSION: ${{ needs.vorpruefung.outputs.version }}
        run: |
          $exe = "target\release\quadchroma.exe"
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          if ($text -match 'VCRUNTIME140') { throw "quadchroma.exe imports VCRUNTIME140 - crt-static is not in effect" }
          # The package contains only avcodec-63.dll and avutil-61.dll - the exe must not load
          # any other FFmpeg DLL.
          foreach ($dll in 'avcodec-63.dll', 'avutil-61.dll') { if ($text -notmatch [regex]::Escape($dll)) { throw "quadchroma.exe does not import $dll - check the package contents" } }
          if ($text -match 'avformat-\d+\.dll|swresample-\d+\.dll|swscale-\d+\.dll|avfilter-\d+\.dll|avdevice-\d+\.dll') { throw "quadchroma.exe imports an FFmpeg DLL that is not shipped: $($Matches[0])" }
          $vi = (Get-Item $exe).VersionInfo
          "ProductVersion=$($vi.ProductVersion) FileVersion=$($vi.FileVersion) CompanyName=$($vi.CompanyName) ProductName=$($vi.ProductName)"
          if ($vi.ProductVersion -ne $env:VERSION) { throw "Version resource '$($vi.ProductVersion)' does not match the tag v$env:VERSION" }

      - name: Tests (separate APPDATA, FFmpeg DLLs in PATH)
        env:
          APPDATA: ${{ runner.temp }}\appdata-tests
        run: |
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          cargo test --release --locked

      - name: Upload the exe as an artifact (unsigned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-exe-unsigned
          path: client/target/release/quadchroma.exe
          if-no-files-found: error

      - name: Upload the FFmpeg DLLs as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-ffmpeg-dlls
          path: ${{ runner.temp }}\dlls\*
          if-no-files-found: error

  windows-signieren:
    name: Sign for Windows (Azure Artifact Signing)
    needs: [vorpruefung, windows]
    # Switch from vorpruefung; secrets are not available in jobs.<id>.if.
    if: needs.vorpruefung.outputs.windows_sign == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # needed only for the OIDC login (azure/login)
    steps:
      - name: Checkout (for scripts/sign-windows.ps1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the unsigned exe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-exe-unsigned
          path: ${{ runner.temp }}\sign

      - name: Azure login via OIDC (no client secret)
        if: needs.vorpruefung.outputs.azure_oidc == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign (SHA-256, RFC 3161 timestamp from Microsoft)
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          # With a client secret the action logs in by itself (EnvironmentCredential). If the
          # secret is empty, it skips that path and uses the login from azure/login (OIDC).
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ runner.temp }}\sign
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: QuadChroma
          description-url: https://github.com/quadchroma-tech/quadchroma

      - name: Verify the signature (signtool verify /pa via scripts/sign-windows.ps1)
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/sign-windows.ps1 "$env:RUNNER_TEMP\sign\quadchroma.exe" -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw "signtool verify: exit code $LASTEXITCODE" }

      - name: Upload the signed exe as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-exe-signed
          path: ${{ runner.temp }}\sign\quadchroma.exe
          if-no-files-found: error

  windows-paket:
    name: Package the Windows ZIP
    needs: [vorpruefung, windows, windows-signieren]
    # windows-signieren may have been skipped (no secrets), but must not have failed.
    if: ${{ !cancelled() && needs.windows.result == 'success' && (needs.windows-signieren.result == 'success' || needs.windows-signieren.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.vorpruefung.outputs.version }}
      SIGNED: ${{ needs.windows-signieren.result == 'success' }}
    steps:
      - name: Checkout (companion files)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the exe (signed if available)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.SIGNED == 'true' && 'windows-exe-signed' || 'windows-exe-unsigned' }}
          path: stage/quadchroma-${{ env.VERSION }}

      - name: Download the FFmpeg DLLs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-ffmpeg-dlls
          path: stage/quadchroma-${{ env.VERSION }}

      - name: Add the companion files and build the ZIP
        shell: bash
        run: |
          set -euo pipefail
          d="stage/quadchroma-$VERSION"
          # The four companion files are mandatory and all .txt in the package (README.txt is
          # made from README.md) - the same script as make dmg in the macOS job. If a source is
          # missing, the job fails with the file name in the error message.
          scripts/package-texts.sh "$d" 1
          # Check the contents: exe, two DLLs, FFmpeg build information, four companion files -
          # no more, no less.
          # Expected list in C sort order (uppercase before lowercase); the actual list is
          # sorted the same way with LC_ALL=C, independent of the runner's locale.
          erwartet="FFMPEG-BUILDINFO.txt LICENSE.txt MANUAL.txt README.txt THIRD_PARTY_NOTICES.txt avcodec-63.dll avutil-61.dll quadchroma.exe"
          ist=$(ls "$d" | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')
          [ "$ist" = "$erwartet" ] || { echo "::error::unexpected package contents: $ist"; exit 1; }
          suffix=""; [ "$SIGNED" = "true" ] || suffix="-unsigned"
          mkdir -p dist
          (cd stage && zip -r -X "../dist/quadchroma-$VERSION-windows-x64$suffix.zip" "quadchroma-$VERSION")
          ls -l dist

      - name: Upload the Windows package as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: Build, sign, notarize and package the macOS app
    needs: vorpruefung
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.vorpruefung.outputs.version }}
      SIGN: ${{ needs.vorpruefung.outputs.mac_sign }}
      NOTARIZE: ${{ needs.vorpruefung.outputs.mac_notarize }}
      SELBST: ${{ needs.vorpruefung.outputs.mac_selbst }}
      # Signing identity for the Makefile; "-" is the ad-hoc signature without a certificate,
      # "QuadChroma Release" the project's own free certificate (without a timestamp).
      # The Makefile adds --timestamp automatically as soon as IDENT contains "Developer ID"
      # or is a 40-character SHA-1 hash from `security find-identity`.
      IDENT: ${{ needs.vorpruefung.outputs.mac_sign == 'true' && secrets.APPLE_SIGNING_IDENTITY || (needs.vorpruefung.outputs.mac_selbst == 'true' && 'QuadChroma Release' || '-') }}
      # Every make call of this job: the companion texts (in the app, next to it in the ZIP and
      # the DMG) are mandatory - a missing source stops the build, whatever IDENT is.
      DMG_EXTRA_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set the artifact name (suffix -unsigned, -selfsigned or -unnotarized)
        run: |
          set -euo pipefail
          suffix=""
          [ "$SIGN" = "true" ] || suffix="-unsigned"
          [ "$SIGN" = "true" ] || [ "$SELBST" != "true" ] || suffix="-selfsigned"
          [ "$SIGN" != "true" ] || [ "$NOTARIZE" = "true" ] || suffix="-unnotarized"
          echo "NAME=QuadChroma-$VERSION-macos-arm64$suffix" >> "$GITHUB_ENV"
          mkdir -p dist
          echo "Artifacts: QuadChroma-$VERSION-macos-arm64$suffix.{zip,dmg}"

      - name: Load the Developer ID certificate into a temporary keychain
        if: env.SIGN == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Apple's intermediate certificate "Developer ID - G2" (valid until 2031-09-17), SHA-256 of
          # the DER file from https://www.apple.com/certificateauthority/ - in case the chain
          # is not included in the .p12 (otherwise: "unable to build chain to self-signed root").
          G2_CA_URL: https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          G2_CA_SHA256: f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
        run: |
          set -euo pipefail
          # Commands as in GitHub's guide "Installing an Apple certificate on macOS runners".
          keychain="$RUNNER_TEMP/quadchroma-signing.keychain-db"
          passwort=$(openssl rand -hex 24)
          echo "::add-mask::$passwort"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$passwort" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$passwort" "$keychain"
          security import "$p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$p12"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" "$G2_CA_URL"
          echo "$G2_CA_SHA256  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || echo "Intermediate certificate already present"
          security set-key-partition-list -S apple-tool:,apple: -k "$passwort" "$keychain"
          security list-keychain -d user -s "$keychain"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain"

      - name: Load the project's own release certificate into a temporary keychain
        if: env.SIGN != 'true' && env.SELBST == 'true'
        env:
          P12_BASE64: ${{ secrets.MAC_SELFSIGNED_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_SELFSIGNED_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # As with the Developer ID certificate, only without Apple's intermediate certificate:
          # the project's own certificate is self-signed. codesign needs no trust setting for it.
          keychain="$RUNNER_TEMP/quadchroma-signing.keychain-db"
          passwort=$(openssl rand -hex 24)
          echo "::add-mask::$passwort"
          p12="$RUNNER_TEMP/quadchroma-release.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$passwort" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$passwort" "$keychain"
          security import "$p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$passwort" "$keychain"
          security list-keychain -d user -s "$keychain"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

      # The app's executable is the Rust client with the host engine built in (make runs
      # cargo build --release --locked in client/).
      - name: Rust (stable)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Build the app (make; signed with IDENT, ad-hoc without a certificate)
        run: make IDENT="$IDENT"

      - name: Developer ID signature with timestamp and hardened runtime (make sign)
        if: env.SIGN == 'true'
        run: |
          set -euo pipefail
          make sign IDENT="$IDENT"
          codesign -dvv build/QuadChroma.app 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp|Signed Time|Runtime Version)' || true
          codesign -dvv build/QuadChroma.app 2>&1 | grep -q '^Timestamp=' \
            || { echo "::error::signature without a secure timestamp (Timestamp= is missing) - notarization would reject it"; exit 1; }

      - name: Verify the signature (make verify - codesign --strict, entitlements, Gatekeeper preview)
        run: make verify IDENT="$IDENT"

      - name: Check the app (one executable, the Rust client with the host engine; no FFmpeg)
        run: |
          set -euo pipefail
          macos=build/QuadChroma.app/Contents/MacOS
          [ "$(ls "$macos")" = "quadchroma" ] || { echo "::error::Contents/MacOS must hold exactly the one executable quadchroma, found: $(ls "$macos" | tr '\n' ' ')"; exit 1; }
          exe="$macos/quadchroma"
          otool -L "$exe"
          if otool -L "$exe" | grep -Ei 'libav|libsw|ffmpeg'; then echo "::error::the Mac app links FFmpeg - it decodes with VideoToolbox and must not"; exit 1; fi
          # Symbols into a file first: grep -q ending early would break nm's pipe (pipefail).
          nm "$exe" > "$RUNNER_TEMP/app-symbole.txt"
          if grep -Eq ' _av(codec|util|format)?_[a-z]' "$RUNNER_TEMP/app-symbole.txt"; then echo "::error::FFmpeg symbols in the Mac app"; exit 1; fi
          # The host engine is built in (host/dienst.h), not a second program.
          grep -q ' _qc_dienst_starten$' "$RUNNER_TEMP/app-symbole.txt" || { echo "::error::the host engine (qc_dienst_starten) is missing from the app"; exit 1; }

      - name: Helper script for notarization (Apple ID, team ID, app-specific password)
        if: env.NOTARIZE == 'true'
        run: |
          set -euo pipefail
          # notarize.sh <file> <log.json>: submit, wait, fetch the log (always read it, even
          # for Accepted), exit with an error for any status other than "Accepted". The
          # credentials come from the environment of the calling step. Same logic as the
          # Makefile target notarize, only with --apple-id instead of a keychain profile.
          cat > "$RUNNER_TEMP/notarize.sh" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          datei="$1"; protokoll="$2"
          args=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD")
          # "|| true": notarytool's exit code decides nothing here (the man page does not
          # define it); the status line below is what counts. Without the guard, set -e would
          # abort on a non-zero exit code before the log has been fetched.
          ausgabe=$(xcrun notarytool submit "$datei" "${args[@]}" --wait --timeout 45m | tee /dev/stderr || true)
          id=$(printf '%s\n' "$ausgabe" | sed -n 's/^ *id: *//p' | head -n 1)
          [ -n "$id" ] || { echo "::error::no submission ID in the notarytool output"; exit 1; }
          xcrun notarytool log "$id" "${args[@]}" "$protokoll" || true
          if [ -f "$protokoll" ]; then cat "$protokoll"; echo; fi
          printf '%s\n' "$ausgabe" | grep -q '^ *status: Accepted' \
            || { echo "::error::notarization of $(basename "$datei") was not accepted - log: $protokoll"; exit 1; }
          EOF
          chmod +x "$RUNNER_TEMP/notarize.sh"

      - name: Notarize the app and staple the ticket (make zip, notarytool, make staple)
        if: env.NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          # The notary service does not accept a bare .app: submit a ZIP, then staple the ticket to the app.
          make zip IDENT="$IDENT" ZIP="$RUNNER_TEMP/QuadChroma-notarize.zip"
          "$RUNNER_TEMP/notarize.sh" "$RUNNER_TEMP/QuadChroma-notarize.zip" "$RUNNER_TEMP/notary-log-app.json"
          # make staple: stapler staple + validate, then the distribution ZIP with the stapled app.
          make staple IDENT="$IDENT" ZIP="dist/$NAME.zip"

      - name: ZIP without notarization (make zip)
        if: env.NOTARIZE != 'true'
        run: make zip IDENT="$IDENT" ZIP="dist/$NAME.zip"

      - name: Build and sign the DMG (make dmg; contains the app, an Applications link and the companion files - fails if one is missing)
        run: make dmg IDENT="$IDENT" DMG="dist/$NAME.dmg" DMG_EXTRA_REQUIRED=1

      - name: Notarize the DMG and staple the ticket (notarytool, make staple-dmg)
        if: env.NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/notarize.sh" "dist/$NAME.dmg" "$RUNNER_TEMP/notary-log-dmg.json"
          make staple-dmg DMG="dist/$NAME.dmg"

      - name: Check the packages (make check-packages - the four companion texts in the app, next to it in the ZIP and in the DMG)
        run: make check-packages ZIP="dist/$NAME.zip" DMG="dist/$NAME.dmg"

      - name: Final Gatekeeper check (make gatekeeper - spctl must accept)
        if: env.NOTARIZE == 'true'
        run: make gatekeeper ZIP="dist/$NAME.zip" DMG="dist/$NAME.dmg"

      - name: Upload the notarization logs as an artifact
        if: ${{ always() && env.NOTARIZE == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notary-logs
          path: ${{ runner.temp }}/notary-log-*.json
          if-no-files-found: ignore

      - name: Remove the keychain and credentials
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f "$RUNNER_TEMP/notarize.sh" "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/quadchroma-release.p12" "$RUNNER_TEMP/QuadChroma-notarize.zip"

      - name: Upload the macOS packages as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-macos
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  release:
    name: Create the release draft
    needs: [vorpruefung, ffmpeg, windows-paket, macos]
    if: ${{ !cancelled() && needs.vorpruefung.result == 'success' && needs.ffmpeg.result == 'success' && needs.windows-paket.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the release and upload the assets
    env:
      VERSION: ${{ needs.vorpruefung.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout (for gh in the repository context)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS.txt and release notes
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # Release page: which single file to download for each computer, first start,
          # FFmpeg notice (ffmpeg.org/legal.html) - see scripts/release-notes.sh.
          bash ../scripts/release-notes.sh . "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > ../notes.md
          cat ../notes.md

      - name: Create the draft (gh release create --draft)
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "QuadChroma $VERSION" --notes-file notes.md dist/*
          echo "Release draft for $GITHUB_REF_NAME created - review it and publish it by hand." >> "$GITHUB_STEP_SUMMARY"
