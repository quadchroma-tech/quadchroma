# Build settings for the client.
#
# Windows: link the C runtime statically into the exe. Otherwise the exe
# imports VCRUNTIME140.dll from the Visual C++ Redistributable, which may be
# missing on a fresh Windows installation - then even the start fails with a
# system dialog. With crt-static the exe needs no runtime DLL; the FFmpeg DLLs
# use the UCRT, which is part of the system since Windows 10. No memory, no
# file and no errno crosses between the two: FFmpeg frees what FFmpeg
# allocated.
#
# Caution: Cargo reads this file only when building from client\ (or below),
# and a set RUSTFLAGS environment variable silently replaces this setting.
# So that this does not go unnoticed, the build then fails (guard at the top
# of src/main.rs).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
