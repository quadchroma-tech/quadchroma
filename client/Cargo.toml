[package]
name = "quadchroma"
version = "0.1.0"
edition = "2021"
authors = ["Robert Brandt <hello@quadchroma.tech>"]
description = "QuadChroma remote desktop (HEVC 4:4:4): Windows client and host role, Mac client"
homepage = "https://github.com/quadchroma-tech/quadchroma"
repository = "https://github.com/quadchroma-tech/quadchroma"
# PolyForm Strict 1.0.0 plus the licensor's additional terms; the full text
# is in LICENSE.txt in the repository root. Not a crates.io package.
# PolyForm Strict is not on the SPDX license list (only Noncommercial and
# Small Business are), so both parts are given as LicenseRef- (SPDX 2.3,
# licenses not on the list): the expression stays machine-readable for
# cargo-deny, cargo-about and REUSE. The same identifier belongs in
# LICENSE.txt and in any SPDX header lines.
license = "LicenseRef-PolyForm-Strict-1.0.0 AND LicenseRef-QuadChroma-Additional-Terms-1.0"
publish = false
# Windows: embed the version info, program icon and application manifest
# from res/ into the exe (rc.exe or llvm-rc); on the Mac build.rs does nothing.
build = "build.rs"

[dependencies]
# Pinned exactly: the Mac menu bar (host/menue.m) adds methods to winit's own
# application delegate class, an internal detail of this version. Check
# menue.m (an_winits_delegate_haengen) before moving to another winit.
winit = "=0.30.13"
softbuffer = "0.4"
rayon = "1.10"
fontdue = "0.9"
snow = { version = "0.10", default-features = false, features = [
    "default-resolver",
    "use-curve25519",
    "use-chacha20poly1305",
    "use-sha2",
    "use-getrandom",
    "std",
] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[target.'cfg(windows)'.dependencies]
# Decoder of the Windows client and encoder of the host role. The Mac client
# decodes with VideoToolbox (src/vt_decoder.rs) and needs no FFmpeg.
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "format"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # Host role: input (SendInput), keeping the display awake, DPI, memory/load,
    # broadcast addresses of the network adapters, send buffers, performance counters
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Power",
    "Win32_UI_HiDpi",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Performance",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    # Host role: cancel a blocked write to a viewer that has been replaced
    # (CancelIoEx, see host/netz.rs)
    "Win32_System_IO",
    # Files via the clipboard: free space before accepting a transfer
    # (GetDiskFreeSpaceExW, see dateien.rs); desktop shortcut:
    # IShellLinkW::GetPath when reading it back in the test (verknuepfung.rs)
    "Win32_Storage_FileSystem",
    # Host role: display name of a screen (QueryDisplayConfig,
    # DisplayConfigGetDeviceInfo, see host/aufnahme.rs)
    "Win32_Devices_Display",
    # Access (pairing): random access password from the system CSPRNG
    # (BCryptGenRandom, see zugang.rs)
    "Win32_Security_Cryptography",
    # Host role: a sound when a device asks to be allowed (MessageBeep, see
    # host/fenster.rs)
    "Win32_System_Diagnostics_Debug",
] }
