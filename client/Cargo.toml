[package]
name = "quadchroma"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
rayon = "1.10"
fontdue = "0.9"
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "format"] }
snow = { version = "0.10", default-features = false, features = [
    "default-resolver",
    "use-curve25519",
    "use-chacha20poly1305",
    "use-sha2",
    "use-getrandom",
    "std",
] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # Host-Rolle: Eingaben (SendInput), Bildschirm wach, DPI, Speicher/Last,
    # Rundrufadressen der Netzwerkkarten, Sendepuffer, Hochleistungszaehler
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Power",
    "Win32_UI_HiDpi",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Performance",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    # Host-Rolle: einen haengenden write an einen abgeloesten Zuschauer
    # abbrechen (CancelIoEx, siehe host/netz.rs)
    "Win32_System_IO",
    # Dateien ueber die Zwischenablage: freier Platz vor der Annahme
    # (GetDiskFreeSpaceExW, siehe dateien.rs); Desktop-Verknuepfung:
    # IShellLinkW::GetPath beim Zuruecklesen im Test (verknuepfung.rs)
    "Win32_Storage_FileSystem",
] }
